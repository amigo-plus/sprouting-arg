<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メッセージ / Y</title>
  <style>
    /* ----------------------------------------------------
       Base & Reset Styles
       ---------------------------------------------------- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #e7e9ea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ----------------------------------------------------
       App Container Layout
       ---------------------------------------------------- */
    .app-container {
      display: flex;
      width: 100%;
      flex: 1;
      min-height: 0;
      background-color: #000000;
    }

    /* Left Icon Sidebar */
    .left-sidebar {
      width: 68px;
      border-right: 1px solid #2f3336;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 0;
      gap: 20px;
      flex-shrink: 0;
    }

    /* Custom Y Logo */
    .y-logo {
      font-size: 26px;
      font-weight: 900;
      color: #f7f9f9;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      user-select: none;
      font-family: Arial, sans-serif;
    }

    .nav-icon {
      width: 24px;
      height: 24px;
      color: #71767b;
      cursor: pointer;
      transition: color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .nav-icon.active, .nav-icon:hover {
      color: #e7e9ea;
    }

    /* DM List Sidebar */
    .dm-sidebar {
      width: 320px;
      border-right: 1px solid #2f3336;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .dm-sidebar-header {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 20px;
      font-weight: 700;
    }

    .dm-search-box {
      margin: 0 16px 12px 16px;
      background-color: #202327;
      border-radius: 9999px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #71767b;
      font-size: 14px;
    }

    .chat-list {
      overflow-y: auto;
      flex: 1;
    }

    .chat-item {
      display: flex;
      padding: 12px 16px;
      gap: 12px;
      cursor: pointer;
      transition: background-color 0.2s;
      align-items: center;
    }

    .chat-item:hover, .chat-item.active {
      background-color: #16181c;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background-color: #333639;
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #eff3f4;
      font-size: 16px;
    }

    .chat-info {
      flex: 1;
      min-width: 0;
    }

    .chat-header-line {
      display: flex;
      justify-content: space-between;
      font-size: 15px;
      margin-bottom: 2px;
    }

    .user-name {
      font-weight: 700;
      color: #f7f9f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-time {
      color: #71767b;
      font-size: 13px;
    }

    .chat-preview {
      color: #71767b;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Main Chat Area */
    .chat-window {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      background-color: #000000;
    }

    .chat-window-header {
      height: 53px;
      border-bottom: 1px solid #2f3336;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
    }

    .chat-window-header .user-name {
      font-size: 18px;
    }

    .message-area {
      flex: 1;
      padding: 20px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Message Bubbles */
    .message-row {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      opacity: 0;
      transform: translateY(8px);
      animation: fadeInMsg 0.25s forwards ease-out;
    }

    /* 即時表示用のクラス（アニメーションなし） */
    .message-row.instant {
      opacity: 1;
      transform: translateY(0);
      animation: none;
    }

    @keyframes fadeInMsg {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .bubble {
      max-width: 68%;
      padding: 12px 16px;
      border-radius: 20px 20px 20px 4px;
      background-color: #2f3336;
      color: #f7f9f9;
      font-size: 15px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    /* Image Attachment Frame */
    .image-bubble {
      max-width: 300px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #2f3336;
      background-color: #16181c;
      margin-top: 2px;
    }

    .image-bubble img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    /* Typing Indicator Animation */
    .typing-row {
      display: none;
      align-items: center;
      margin-bottom: 4px;
    }

    .typing-row.visible {
      display: flex;
    }

    .typing-box {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 12px 16px;
      background-color: #2f3336;
      border-radius: 20px 20px 20px 4px;
    }

    .dot {
      width: 6px;
      height: 6px;
      background-color: #71767b;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1.0); }
    }

    /* Chat Input Controls */
    .chat-input-bar {
      height: 60px;
      border-top: 1px solid #2f3336;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
    }

    .input-wrapper {
      flex: 1;
      background-color: #202327;
      border-radius: 9999px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
    }

    .input-wrapper input {
      background: none;
      border: none;
      color: #e7e9ea;
      font-size: 15px;
      width: 100%;
      outline: none;
    }

    .input-wrapper input::placeholder {
      color: #71767b;
    }

    /* Footer Styles */
    .site-footer {
      width: 100%;
      padding: 12px;
      text-align: center;
      font-size: 12px;
      color: #71767b;
      background-color: #000000;
      border-top: 1px solid #2f3336;
      flex-shrink: 0;
    }

    .site-footer p {
      margin: 2px 0;
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- Left Sidebar with Y Logo -->
    <div class="left-sidebar">
      <div class="y-logo">Y</div>
      
      <!-- 家のマーク（Home Icon）: ルート直下の index.html へ遷移 -->
      <a href="../index.html" class="nav-icon" title="ホームに戻る">
        <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3s-9 7.5-9 8.5V21h6v-6h6v6h6v-9.5C21 10.5 12 3 12 3z"/></svg>
      </a>

      <!-- Search Icon -->
      <div class="nav-icon">
        <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M10.25 3.75a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zm-8.5 6.5a8.5 8.5 0 1 1 15.176 5.262l4.531 4.531-1.414 1.414-4.531-4.531A8.5 8.5 0 0 1 1.75 10.25z"/></svg>
      </div>

      <!-- DM Active Icon -->
      <div class="nav-icon active">
        <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M1.998 5.5c0-1.381 1.119-2.5 2.5-2.5h15c1.381 0 2.5 1.119 2.5 2.5v13c0 1.381-1.119 2.5-2.5 2.5h-15c-1.381 0-2.5-1.119-2.5-2.5v-13zm2.5-.5c-.276 0-.5.224-.5.5v.432l8 5 8-5V5.5c0-.276-.224-.5-.5-.5h-15z"/></svg>
      </div>
    </div>

    <!-- DM List Panel -->
    <div class="dm-sidebar">
      <div class="dm-sidebar-header">
        <span>メッセージ</span>
      </div>
      <div class="dm-search-box">
        <span>🔍</span>
        <span>ダイレクトメッセージを検索</span>
      </div>
      <div class="chat-list">
        <div class="chat-item active">
          <div class="avatar">友</div>
          <div class="chat-info">
            <div class="chat-header-line">
              <span class="user-name">イルマ＠オカルト垢</span>
              <span class="chat-time">今</span>
            </div>
            <div class="chat-preview" id="sidebar-preview">入力中...</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Chat Window -->
    <div class="chat-window">
      <div class="chat-window-header">
        <div class="avatar" style="width: 32px; height: 32px; font-size: 13px;">友</div>
        <div class="user-name">イルマ＠オカルト垢</div>
      </div>

      <!-- Messages Stream Area -->
      <div class="message-area" id="messageArea">
        
        <!-- Dynamic Typing Indicator -->
        <div class="typing-row" id="typingRow">
          <div class="typing-box">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>
        </div>

      </div>

      <!-- Footer Input -->
      <div class="chat-input-bar">
        <div class="input-wrapper">
          <input type="text" placeholder="新しいメッセージを作成" disabled>
        </div>
      </div>
    </div>

  </div>

  <!-- フッター -->
  <footer class="site-footer">
    <p>&copy; amigo</p>
    <p>このWebサイトの内容はすべてフィクションであり、実在の人物・団体とは一切関係がありません。</p>
  </footer>

  <script>
    const messageSequence = [
      { type: "text", text: "なあなあ", delay: 1200 },
      { type: "text", text: "たまたま見つけたんだけどさ、", delay: 1800 },
      { 
        type: "image", 
        src: "https://placehold.co/600x400/2f3336/e7e9ea?text=%5B%E8%A9%97%E3%81%AE%E7%94%BB%E5%83%8F%5D", 
        alt: "送られてきた画像",
        delay: 2000 
      },
      { type: "text", text: "これなんかオカルト臭しないか？w", delay: 1500 },
      { type: "text", text: "昔一瞬出回ってたみたいなんだが、", delay: 1600 },
      { type: "text", text: "全然詳細がわかんねえんだ", delay: 1500 },
      { type: "text", text: "出所も、作者も、他の内容も", delay: 1200 },
      { type: "text", text: "なーんにも出てこねえ！", delay: 1200 },
      { type: "text", text: "んでなんか俺の中のシックスセンスがピーンと来ちゃったのよ！w", delay: 1600 },
      { type: "text", text: "これは隠蔽されてるとんでもない事件に違いない！ってな", delay: 1500 },
      { type: "text", text: "絶対お前もこういうの好きだろ？", delay: 1400 },
      { type: "text", text: "まあとりあえず調べてみてくれよ！w", delay: 1600 },
    ];

    const messageArea = document.getElementById("messageArea");
    const typingRow = document.getElementById("typingRow");
    const sidebarPreview = document.getElementById("sidebar-preview");

    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    // メッセージ要素を作成する共通関数
    function createMessageNode(msg, isInstant = false) {
      const msgRow = document.createElement("div");
      msgRow.className = "message-row" + (isInstant ? " instant" : "");

      if (msg.type === "text") {
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = msg.text;
        msgRow.appendChild(bubble);
        sidebarPreview.textContent = msg.text;
      } else if (msg.type === "image") {
        const imgBubble = document.createElement("div");
        imgBubble.className = "image-bubble";

        const img = document.createElement("img");
        img.src = msg.src;
        img.alt = msg.alt || "画像";

        imgBubble.appendChild(img);
        msgRow.appendChild(imgBubble);
        sidebarPreview.textContent = "[画像]";
      }
      return msgRow;
    }

    // 初回アクセス時：アニメーション付きで順次表示
    async function startChatSequence() {
      await sleep(800);

      for (const msg of messageSequence) {
        typingRow.classList.add("visible");
        messageArea.appendChild(typingRow);
        scrollToBottom();

        await sleep(msg.delay);

        typingRow.classList.remove("visible");

        const msgRow = createMessageNode(msg, false);
        messageArea.insertBefore(msgRow, typingRow);
        scrollToBottom();

        await sleep(600);
      }

      // 完了フラグをローカルストレージに保存
      localStorage.setItem("dm_played", "true");
    }

    // 2回目以降：一括・即時表示
    function showCompletedChat() {
      for (const msg of messageSequence) {
        const msgRow = createMessageNode(msg, true);
        messageArea.appendChild(msgRow);
      }
      scrollToBottom();
    }

    function scrollToBottom() {
      messageArea.scrollTop = messageArea.scrollHeight;
    }

    // ページロード時の判定処理
    window.onload = () => {
      if (localStorage.getItem("dm_played") === "true") {
        showCompletedChat();
      } else {
        startChatSequence();
      }
    };
  </script><!-- YACHO:scripts:start -->
<script src="../assets/js/customPageList.js"></script>
<!-- YACHO:scripts:end -->
</body>
</html>
